<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="xyz-sha256" content="@@REVISION@@">
<title>XYZ 全景图 · @@TITLE@@</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--paper:#fdfdfa;--panel:#f8f8f3;--ink:#222321;--muted:#5f615b;--rule:#d8d9d4;--accent:#8b3e28;--sans:"Microsoft YaHei",system-ui,sans-serif}
body{margin:0;background:#efefec;color:var(--ink);font-family:Georgia,SimSun,serif}
main{width:min(1328px,calc(100% - 48px));margin:22px auto;background:var(--paper);border:1px solid var(--rule);border-top:4px solid #41423e}
header,aside,.fallback,.scene-head{padding:18px 26px}
header{border-bottom:1px solid var(--rule)}
h1{font-size:clamp(27px,4vw,49px);font-weight:500;margin:5px 0 10px}
h2,h3,h4,p{margin:0 0 8px}
p,figcaption{font:14px/1.7 var(--sans)}
small,.meta,figcaption{color:var(--muted)}
a{color:inherit;text-underline-offset:3px}button{font:600 13px var(--sans);color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.explorer{display:none}.ready .explorer{display:block}.ready .fallback{display:none}
nav,.scene-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
nav{padding:8px 20px;border-bottom:1px solid var(--rule)}
.steps,.view{display:flex;gap:5px;align-items:center}
.control{min-height:44px;background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:6px 11px;white-space:nowrap}
.control[aria-current=step]{border-color:var(--accent);color:var(--accent)}
.next{background:#393b35;color:white;border-color:#393b35}
.intro{padding:38px 26px;background:var(--panel)}
figure{margin:0;background:var(--panel)}
.scene-head{flex-wrap:wrap}
.scene-head h2{font-size:20px;margin:0}
.viewport{overflow:auto;position:relative;overscroll-behavior-x:contain}
.viewport[data-phase="3"]:not(.large){cursor:grab;touch-action:pan-y}
.surface{position:relative;width:100%;min-height:210px;container-type:inline-size}
.surface svg,.nodes{position:absolute;inset:0;width:100%;height:100%}
.surface svg{overflow:hidden}
.nodes{pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;height:40px;display:grid;align-content:center;gap:1px;padding:3px 6px;border:1px solid #bfc3b5;background:var(--paper);border-radius:5px;overflow:hidden;text-align:center;font-size:clamp(7px,1.2cqw,15px);line-height:1.13}
.node small{font-size:.77em}
.node span,.node small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node[data-level="3"]{background:#f3eee7;border-color:#c9bdae}
.node[aria-pressed=true]{outline:2px solid var(--accent);color:var(--accent)}
.node.context{border-color:var(--accent)}
.axis,.guide,.route,.plane{fill:none;stroke:#666b61;stroke-width:1.2;vector-effect:non-scaling-stroke}
.guide{stroke:#adada0;stroke-dasharray:3 4}.route{stroke:#877c6c}.route.pending{stroke-dasharray:4 4}
.plane{fill:#eeeee7;stroke:#d8d9cd}
.axis-label{fill:#4d5148;font:600 16px Consolas,monospace}
.context.route,.context.guide{stroke:var(--accent);stroke-width:2}
figcaption,aside,.fallback section{border-top:1px solid var(--rule)}
figcaption{padding:9px 20px;font-size:12px}
aside p.prose{text-indent:2em}
.impact{border-left:2px solid var(--accent);padding-left:12px}
.back{font:13px var(--sans)}
@media(max-width:770px){
 main{width:calc(100% - 20px);margin:10px auto}
 header,aside,.fallback,.scene-head{padding:12px}
 nav{padding:5px 8px}
 .step span{display:none}
 .control{padding:5px 9px}
 .node{height:clamp(12px,6cqw,29px);padding:1px;line-height:1.08}
 .node small{font-size:.85em}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{
 main{width:100%;margin:0;border:0}
 .ready .fallback{display:block}
 .explorer,.ready .explorer,.back{display:none!important}
 .fallback section{break-inside:avoid}
}
</style>
</head>
<body>
<main>
<header>
  <a class="back" href="output.html">← 研究报告</a>
  <h1>@@TITLE@@</h1>
  <p>@@QUESTION@@</p>
  <p class="meta">资料截至 @@CUTOFF@@</p>
</header>
<section class="explorer" aria-label="XYZ 三轴交互图">
  <nav aria-label="依次展开三轴">
    <div class="steps">
      <button class="control step" data-step="1" aria-label="X 关键转折">X <span>关键转折</span></button>
      <button class="control step" data-step="2" aria-label="Y 推动与制约" disabled>Y <span>推动与制约</span></button>
      <button class="control step" data-step="3" aria-label="Z 对主体的影响" disabled>Z <span>对主体的影响</span></button>
    </div>
    <button id="next" class="control next">展开全部 X</button>
  </nav>
  <div class="intro" id="intro"><h2>从时间轴开始</h2><p>依次展开全部转折、因素和影响路径。</p></div>
  <figure id="figure" aria-labelledby="scene-title" hidden>
    <div class="scene-head"><h2 id="scene-title"></h2>
      <div class="view">
        <button class="control" id="zoom" aria-pressed="false">放大标签</button>
        <button class="control" data-turn="-1" aria-label="向左旋转" hidden>←</button>
        <button class="control" data-turn="0" aria-label="复位视角" hidden>复位</button>
        <button class="control" data-turn="1" aria-label="向右旋转" hidden>→</button>
      </div>
    </div>
    <div id="viewport" class="viewport" tabindex="0" aria-label="三维架构，方向键可旋转">
      <div id="surface" class="surface">
        <svg id="plot" aria-hidden="true" preserveAspectRatio="none"></svg>
        <div id="nodes" class="nodes"></div>
      </div>
    </div>
    <figcaption><span id="status" role="status"></span>。间距和景深用于展示结构。</figcaption>
  </figure>
  <aside id="detail" aria-label="节点详情与账本链接" aria-live="polite" hidden></aside>
</section>
<section class="fallback" aria-label="完整 XYZ 路径与证据">
  <h2>XYZ 转折、因素与影响路径</h2>
  @@FALLBACK@@
</section>
</main>
<script>
(()=>{
"use strict";
const data=@@DATA@@;
const $=id=>document.getElementById(id);
const figure=$("figure"), viewport=$("viewport"), surface=$("surface"), plot=$("plot");
const panel=$("detail"), next=$("next"), zoom=$("zoom");
const steps=[...document.querySelectorAll("[data-step]")], turns=[...document.querySelectorAll("[data-turn]")];
const reduced=matchMedia("(prefers-reduced-motion: reduce)");
const constraints=(value,min,max)=>Math.max(min,Math.min(max,value));
const make=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el};
const cards=[], wires=[];
let rows=1;
function add(level, record, col, row, title, meta) {
  const el=make("button","");
  el.className="node";
  el.dataset.level=level;
  el.dataset.id=record.id;
  el.title=title;
  el.setAttribute("aria-label",title+" · "+meta);
  el.setAttribute("aria-controls","detail");
  el.append(make("small",meta),make("span",title));
  const card={level,record,col,row,el,title,meta};
  cards.push(card);
  $("nodes").append(el);
  el.onclick=()=>{selected=card; showDetail(); paint()};
  return card;
}
data.events.forEach((x,col)=>{
  const root=add(1,x,col,0,x.title,x.time);
  const factors=new Map();
  x.factors.forEach((f,row)=>{
    const card=add(2,f,col,row,f.name,f.kind);
    factors.set(f.id,card);
    wires.push({from:root,to:card,level:2});
  });
  const ordered=x.impacts.map(z=>({z,from:z.factors.map(id=>factors.get(id))}))
    .sort((a,b)=>Math.min(...a.from.map(c=>c.row))-Math.min(...b.from.map(c=>c.row)));
  let prior=-1;
  for(const {z,from} of ordered){
    prior=Math.max(prior+1,Math.min(...from.map(c=>c.row)));
    const card=add(3,z,col,prior,z.result,z.pending?"待验证":z.claim);
    for(const factor of from) wires.push({from:factor,to:card,level:3});
  }
  rows=Math.max(rows,x.factors.length,prior+1);
});
const width=Math.max(460,200*data.events.length+142);
const height=190+rows*147+width*.054;
const titles=["","X · 关键转折","X + Y · 推动与制约","X + Y + Z · 对研究主体的影响"];
const labels=["展开全部 X","展开全部 Y","展开全部 Z","从头查看 ↺"];
let phase=0, unlocked=0, selected=null, trace=0, opening=0, depth=0, yaw=0, frame=0, drag=null;

function position(card){
  const x=110+200*card.col;
  const y=phase===1?height*.45:height-115;
  const lift=card.level===1?0:(card.row+1)*147-(card.level===3?68:0);
  const run=card.level===3?(55+19*yaw)*depth:0;
  return [x+run,y-lift*(card.level===2?opening:1)-x*(.029+.014*yaw)*depth];
}
function connected(w){
  return Boolean(selected&&(selected===w.from||selected===w.to));
}
function line(a,b,kind){
  return '<line class="'+kind+'" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';
}
function label(text,x,y){return '<text class="axis-label" x="'+x+'" y="'+y+'">'+text+'</text>'}
function paint(){
  if(!phase)return;
  plot.setAttribute("viewBox","0 0 "+width+" "+height);
  const baseline=phase===1?height*.45:height-115;
  const right=width-48, tilt=(.029+.014*yaw)*depth;
  const origin=[34,baseline-34*tilt], end=[right,baseline-right*tilt];
  const front=[origin[0]+76*depth,origin[1]+69*depth], far=[end[0]+52*depth,end[1]+69*depth];
  let svg=depth>0?'<polygon class="plane" points="'+[origin,end,far,front].map(p=>p.join(",")).join(" ")+'"/>':"";
  const xHead=[origin[0]+(end[0]-origin[0])*trace,origin[1]+(end[1]-origin[1])*trace];
  svg+=line(origin,xHead,"axis")+label("X",xHead[0]+11,xHead[1]+5);
  if(phase>=2) svg+=line(origin,[34,32],"axis")+label("Y",24,25);
  if(phase===3) svg+=line(origin,front,"axis")+label("Z",front[0]+7,front[1]+14);
  for(const w of wires){
    if(w.level>phase)continue;
    const a=position(w.from), b=position(w.to);
    const kind=(w.level===2?"guide":"route")+(connected(w)?" context":"")+(w.to.record.pending?" pending":"");
    svg+='<g data-link="'+w.from.record.id+'-'+w.to.record.id+'">'+line(a,b,kind)+"</g>";
  }
  plot.innerHTML=svg;
  for(const card of cards){
    const {el,level,col}=card;
    el.hidden=level>phase;
    if(el.hidden)continue;
    const [x,y]=position(card);
    el.style.left=100*x/width+"%";
    el.style.top=100*y/height+"%";
    el.style.width=100*(level===3?149:145)/width+"%";
    el.style.opacity=level===3?depth:level===2?opening:trace;
    el.setAttribute("aria-pressed",String(card===selected));
    el.classList.toggle("context",Boolean(selected&&(card.col===selected.col&&card.level===1||
      wires.some(w=>connected(w)&&(w.from===card||w.to===card)))));
  }
}
function showDetail(){
  panel.replaceChildren();
  if(!selected)return;
  const {record,level,title,meta,col}=selected;
  const text=make("p",level===3?record.path.join(" → "):record.detail);
  text.className="prose";
  panel.append(make("small",data.events[col].title+" · "+["","X","Y","Z"][level]+" · "+meta),make("h2",title),text);
  if(level===3){
    text.classList.add("impact");
    const names=new Map(data.events[col].factors.map(f=>[f.id,f.name]));
    panel.append(make("p","相关因素　"+record.factors.map(id=>names.get(id)).join("、")),make("p","成立条件　"+record.condition));
    if(record.evidence)panel.append(make("p",record.evidence));
  }
  const refs=make("p","");
  for(const [id,anchor] of [...record.cites.map(id=>[id,"src-"] ),...(record.claim?[[record.claim,"claim-"]]:[])]){
    const a=make("a",id);
    a.href="output.html#"+anchor+id;
    refs.append(a," ");
  }
  panel.append(refs);
}
function go(value){
  cancelAnimationFrame(frame);
  phase=value;
  unlocked=value?Math.max(value,unlocked):0;
  selected=selected&&selected.level<=value?selected:null;
  figure.hidden=!value;
  $("intro").hidden=Boolean(value);
  panel.hidden=!value;
  viewport.dataset.phase=value;
  surface.style.aspectRatio=width+" / "+(value===1?230:height);
  $("scene-title").textContent=titles[value];
  $("status").textContent=[1,2,3].slice(0,value).map((level,index)=>"XYZ"[index]+" "+cards.filter(c=>c.level===level).length).join(" · ");
  next.textContent=labels[value];
  steps.forEach((el,i)=>{
    el.disabled=i>unlocked;
    if(i+1===value)el.setAttribute("aria-current","step");
    else el.removeAttribute("aria-current");
  });
  turns.forEach(el=>el.hidden=value!==3);
  showDetail();
  if(!selected && value)panel.append(make("p","点选任一节点查看依据。"));
  if(!value)trace=0;
  if(value<2)opening=0;
  if(value<3){depth=0;yaw=0}
  const start=performance.now(), initialX=trace, initialY=opening, initialZ=depth;
  function tick(now){
    const t=reduced.matches?1:constraints((now-start)/450,0,1);
    const eased=t*t*(3-2*t);
    trace=value?initialX+(1-initialX)*eased:0;
    opening=value>=2?initialY+(1-initialY)*eased:0;
    depth=value===3?initialZ+(1-initialZ)*eased:0;
    paint();
    if(t<1)frame=requestAnimationFrame(tick);
  }
  tick(start);
}
function rotate(dir){
  yaw=dir?constraints(yaw+dir*.5,-1,1):0;
  paint();
}
next.onclick=()=>go(phase===3?0:phase+1);
steps.forEach(el=>el.onclick=()=>go(Number(el.dataset.step)));
turns.forEach(el=>el.onclick=()=>rotate(Number(el.dataset.turn)));
zoom.onclick=()=>{
  const expanded=viewport.classList.toggle("large");
  surface.style.minWidth=expanded?width+"px":"";
  zoom.textContent=expanded?"查看全图":"放大标签";
  zoom.setAttribute("aria-pressed",String(expanded));
  if(!expanded)viewport.scrollLeft=0;
};
viewport.onkeydown=event=>{
  if(phase!==3||event.target!==viewport)return;
  const dir={ArrowLeft:-1,ArrowRight:1,Home:0}[event.key];
  if(dir!==undefined){event.preventDefault();rotate(dir)}
};
viewport.onpointerdown=event=>{
  if(phase!==3||event.button!==0||viewport.classList.contains("large")||event.target.closest("button"))return;
  drag={id:event.pointerId,x:event.clientX,yaw};
  viewport.setPointerCapture(event.pointerId);
};
viewport.onpointermove=event=>{
  if(!drag||drag.id!==event.pointerId)return;
  yaw=constraints(drag.yaw+(event.clientX-drag.x)/220,-1,1);
  paint();
};
viewport.onlostpointercapture=()=>{drag=null};
if(new URLSearchParams(location.search).get("motion")!=="static"){
  go(reduced.matches?3:0);
  if(reduced.matches)$("next").hidden=true;
  document.documentElement.classList.add("ready");
}
})();
</script>
</body>
</html>
