<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纵向三系列分组柱</title><style>*{box-sizing:border-box}body{--paper:#ffffff;--ink:#222222;--body:#444444;--grid:#dddddd;--bar:#aaaaaa;--accent:#222222;--soft:#eeeeee;margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Georgia,'Noto Serif SC',SimSun,serif}a{color:inherit;text-underline-offset:4px}button{cursor:pointer;border:0;background:transparent;padding:5px 14px;font:inherit;color:inherit}main{max-width:1500px;margin:auto;padding:35px 4.6vw}header{border-bottom:1px solid var(--ink);padding-bottom:20px}h1{font-weight:400;font-size:28px;line-height:1.18;letter-spacing:0;margin:0}h2{font-size:20px;margin:0;font-weight:600}small,.meta{font:12px/1.5 Georgia,SimSun,serif;letter-spacing:.06em;color:var(--body)}.tools{display:flex;gap:22px;align-items:center;margin:22px 0 0;font-size:14px;border-bottom:1px solid var(--grid);padding-bottom:10px}.tools b{font-weight:600}.tools a{text-decoration:none;border-bottom:1px solid var(--grid)}.tools a:hover{border-color:var(--ink)}.theme-note{margin:8px 0 0;font-size:12px;letter-spacing:.06em;color:var(--body)}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin:26px 0 18px}.panel{border-top:1px solid var(--grid);padding:14px 0 0}.panel h2{margin:3px 0 1px}.panel svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:var(--body)}.standard{border-top:1px solid var(--ink);padding-top:12px;margin-top:26px}.standard p{margin:8px 0 0;color:var(--body)}.solo{max-width:840px}.solo .panel{border:0}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><body><main><header><div><small>数值比较　/　多系列数值对比</small><h1>多系列数值对比</h1></div><p class="theme-note">这里只给黑白灰基准，颜色、字体按 themes/ 里的主题配置换用</p></header><div class="solo"><article class="panel"><small>BAR-004-A</small><h2>纵向三系列分组柱</h2><span class="meta">同一类别内比较三个系列</span><svg viewBox="0 0 570 330" data-form="A" role="img" aria-label="纵向三系列分组柱：类别 A 至 D，每类三个系列"></svg></article><small>A–D 与系列名均为占位，数值仅用于展示素材。</small></div></main><script>// 修改 data 即可替换类别、数值和重点项；两种形态共用这一数据结构。
const data=[{label:'A',values:[12,10,8]},{label:'B',values:[9,11,7]},{label:'C',values:[6,8,10]},{label:'D',values:[3,5,7]}];
const series=[{name:'系列一',color:'#222222'},{name:'系列二',color:'#888888'},{name:'系列三',color:'#cccccc'}];
const unit='单位', chartTitle='图表标题', categoryAxis='类别名称', valueAxis='名称 / '+unit;
const ns='http://www.w3.org/2000/svg';
function node(svg,tag,attrs,msg){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(msg!==undefined)n.textContent=msg;svg.append(n);return n}
function draw(svg){
 const horizontal=svg.dataset.form==='B',left=horizontal?Math.max(55,16+Math.max(...data.map(d=>Array.from(d.label).length))*15):65,right=horizontal?540:545,top=47,bottom=248;
 const max=Math.max(...data.flatMap(d=>d.values),1),power=10**Math.floor(Math.log10(max/4)),step=([1,2,2.5,5,10].find(x=>x*power>=max/4)||10)*power,limit=Math.ceil(max/step)*step;
 function text(x,y,t,anchor='start',size=14){return node(svg,'text',{x,y,'text-anchor':anchor,'font-size':size},t)}
 node(svg,'title',{},data.map(d=>d.label+' '+d.values.join('、')+unit).join('，'));
 text(285,25,chartTitle,'middle',20).setAttribute('font-weight','600');
 node(svg,'path',{d:'M'+left+' '+top+' V'+bottom+' H'+right,stroke:'var(--ink)',fill:'none','stroke-width':1.3});
 if(!horizontal){const axisTitle=text(17,(top+bottom)/2,valueAxis,'middle',14);axisTitle.setAttribute('transform','rotate(-90 17 '+((top+bottom)/2)+')');}
 if(horizontal)text(right,bottom+47,valueAxis,'end',12);
 node(svg,'path',{d:`M${left} ${top+1}v-8l-3 4 M${right-1} ${bottom}h9l-4 3`,fill:'none',stroke:'var(--ink)','stroke-width':1.3});
 for(let v=0;v<=limit;v+=step){const x=left+(right-left)*v/limit,y=bottom-(bottom-top)*v/limit;
 if(v>0) node(svg,'line',horizontal?{x1:x,y1:top,x2:x,y2:bottom,stroke:'var(--grid)'}:{x1:left,y1:y,x2:right,y2:y,stroke:'var(--grid)'});
 if(horizontal)text(x,bottom+22,v,'middle',12);else text(left-9,y+4,v,'end',12)}

 data.forEach((d,i)=>{
 const band=(right-left)/data.length,mid=left+band*(i+.5),w=23,gap=5,total=3*w+2*gap;
 d.values.forEach((v,k)=>{const x=mid-total/2+k*(w+gap),height=(bottom-top)*v/limit;
 node(svg,'rect',{x,y:bottom-height,width:w,height,fill:series[k].color});
 text(x+w/2,bottom-height-7,v,'middle',14);
 });
 text(mid,bottom+25,d.label,'middle',14);
 });
 // 在图表中心下方放置三项图例。
 const itemWidth=102,start=285-itemWidth*3/2;
 series.forEach((v,i)=>{const x=start+i*itemWidth;node(svg,'rect',{x,y:302,width:12,height:12,fill:v.color});text(x+20,313,v.name,'start',14)});
}
document.querySelectorAll('svg').forEach(draw);</script></body></html>
