<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SET-001 集合关系图</title><style>*{box-sizing:border-box}input{accent-color:#555}body{margin:0;padding:32px;font-family:Georgia,'Noto Serif SC','Source Han Serif SC',serif;color:#222;background:white}header{display:flex;align-items:baseline;gap:24px}h1{font-size:26px;font-weight:400}small,footer{color:#777;font-size:14px}.options{display:inline-flex;gap:8px}.choice{cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:block;padding:7px 14px;border:1px solid #ddd;transition:background .2s,border-color .2s}.choice input:checked+span{background:#eee;border-color:#555}.choice input:focus-visible+span{outline:2px solid #555;outline-offset:3px}.controls{flex-wrap:wrap;display:flex;gap:20px;align-items:center;margin:28px 0}select{font:inherit;padding:5px 12px;background:white;border:1px solid #ccc}label{display:flex;gap:8px;align-items:center}.canvas{overflow:auto}svg{display:block;width:100%;min-width:850px}#error{color:#333}footer{margin-top:20px}</style><body data-kind="sets"><header><small>SET-001 · 审核稿</small><h1>集合关系图</h1></header><div class="controls">关系 <span class="options"><label class="choice"><input type="radio" name="mode" value="overlap" checked><span>交集</span></label><label class="choice"><input type="radio" name="mode" value="contain"><span>包含</span></label><label class="choice"><input type="radio" name="mode" value="disjoint"><span>互斥</span></label></span></div><p id="error" role="alert"></p><div class="canvas"><svg role="img" aria-label="集合关系图"></svg></div><footer>此素材表达定性关系，不用于精确编码集合大小。</footer><script src="components.js"></script></body></html>
