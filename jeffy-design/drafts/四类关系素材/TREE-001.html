<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>TREE-001 树状图</title><style>*{box-sizing:border-box}input{accent-color:#555}body{margin:0;padding:32px;font-family:Georgia,'Noto Serif SC','Source Han Serif SC',serif;color:#222;background:white}header{display:flex;align-items:baseline;gap:24px}h1{font-size:26px;font-weight:400}small,footer{color:#777;font-size:14px}.options{display:inline-flex;gap:8px}.choice{cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:block;padding:7px 14px;border:1px solid #ddd;transition:background .2s,border-color .2s}.choice input:checked+span{background:#eee;border-color:#555}.choice input:focus-visible+span{outline:2px solid #555;outline-offset:3px}.controls{flex-wrap:wrap;display:flex;gap:20px;align-items:center;margin:28px 0}select{font:inherit;padding:5px 12px;background:white;border:1px solid #ccc}label{display:flex;gap:8px;align-items:center}.canvas{overflow:auto}svg{display:block;width:100%;min-width:850px}#error{color:#333}footer{margin-top:20px}</style><body data-kind="tree"><header><small>TREE-001 · 审核稿</small><h1>树状图</h1></header><div class="controls">分支数量 <span class="options"><label class="choice"><input type="radio" name="count" value="2"><span>2</span></label><label class="choice"><input type="radio" name="count" value="3" checked><span>3</span></label><label class="choice"><input type="radio" name="count" value="5"><span>5</span></label></span> 方向 <span class="options"><label class="choice"><input type="radio" name="direction" value="horizontal" checked><span>横向展开</span></label><label class="choice"><input type="radio" name="direction" value="vertical"><span>纵向展开</span></label></span></div><p id="error" role="alert"></p><div class="canvas"><svg role="img" aria-label="树状图"></svg></div><footer>节点尺寸由文字测量决定，分支与画布按输入自动排列。</footer><script src="components.js"></script></body></html>
