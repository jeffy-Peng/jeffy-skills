<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>LOOP-001 循环图</title><style>*{box-sizing:border-box}input{accent-color:#555}body{margin:0;padding:32px;font-family:Georgia,'Noto Serif SC','Source Han Serif SC',serif;color:#222;background:white}header{display:flex;align-items:baseline;gap:24px}h1{font-size:26px;font-weight:400}small,footer{color:#777;font-size:14px}.options{display:inline-flex;gap:8px}.choice{cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:block;padding:7px 14px;border:1px solid #ddd;transition:background .2s,border-color .2s}.choice input:checked+span{background:#eee;border-color:#555}.choice input:focus-visible+span{outline:2px solid #555;outline-offset:3px}.controls{flex-wrap:wrap;display:flex;gap:20px;align-items:center;margin:28px 0}select{font:inherit;padding:5px 12px;background:white;border:1px solid #ccc}label{display:flex;gap:8px;align-items:center}.canvas{overflow:auto}svg{display:block;width:100%;min-width:850px}#error{color:#333}footer{margin-top:20px}</style><body data-kind="loop"><header><small>LOOP-001 · 审核稿</small><h1>循环图</h1></header><div class="controls">环节数量 <span class="options"><label class="choice"><input type="radio" name="count" value="3"><span>3</span></label><label class="choice"><input type="radio" name="count" value="4" checked><span>4</span></label><label class="choice"><input type="radio" name="count" value="6"><span>6</span></label></span> <label><input name="reverse" type="checkbox">逆时针</label></div><p id="error" role="alert"></p><div class="canvas"><svg role="img" aria-label="循环图"></svg></div><footer>箭头表达循环方向；环节数量变化时自动计算节点位置与圆周半径。</footer><script src="components.js"></script></body></html>
