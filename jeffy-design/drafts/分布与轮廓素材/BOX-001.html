<!doctype html><meta charset="utf-8"><title>BOX-001 箱线图</title><style>body{margin:32px;font-family:Georgia,"Noto Serif SC","Source Han Serif SC",serif;color:#222}header{display:flex;gap:24px;align-items:baseline}h1{font-size:26px;font-weight:400}small,footer{color:#777;font-size:14px}.controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:28px 0}.options{display:inline-flex;gap:8px}.choice{cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:block;padding:7px 14px;border:1px solid #ddd}.choice input:checked+span{background:#eee;border-color:#555}.choice input:focus-visible+span{outline:2px solid #555}input{accent-color:#555}.canvas{overflow:auto}svg{width:100%;min-width:850px;display:block}footer{margin-top:20px}</style><body data-kind="box"><header><small>BOX-001 · 审核稿</small><h1>箱线图</h1></header><div class="controls">组数 <span class="options"><label class="choice"><input type="radio" name="count" value="4" checked><span>4组</span></label><label class="choice"><input type="radio" name="count" value="2"><span>2组</span></label><label class="choice"><input type="radio" name="count" value="6"><span>6组</span></label></span> 方向 <span class="options"><label class="choice"><input type="radio" name="direction" value="vertical" checked><span>纵向</span></label><label class="choice"><input type="radio" name="direction" value="horizontal"><span>横向</span></label></span><label><input name="labels" type="checkbox">数值标注</label></div><p id="error" role="alert"></p><div class="canvas"><svg role="img" aria-label="箱线图"></svg></div><footer>箱体为 Q1—Q3，粗线为中位数，须为 1.5×IQR 范围内的最远观测，圆点为离群值；分位数使用线性插值。</footer><script src="legend.js"></script><script src="components.js"></script>
