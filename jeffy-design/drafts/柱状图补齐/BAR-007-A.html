<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>实际值与目标</title><style>*{box-sizing:border-box}body{--paper:#ffffff;--ink:#222222;--body:#444444;--grid:#dddddd;--bar:#aaaaaa;--accent:#222222;--soft:#eeeeee;margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Georgia,'Noto Serif SC',SimSun,serif}a{color:inherit;text-underline-offset:4px}button{cursor:pointer;border:0;background:transparent;padding:5px 14px;font:inherit;color:inherit}main{max-width:1500px;margin:auto;padding:35px 4.6vw}header{border-bottom:1px solid var(--ink);padding-bottom:20px}h1{font-weight:400;font-size:28px;line-height:1.18;letter-spacing:0;margin:0}h2{font-size:20px;margin:0;font-weight:600}small,.meta{font:12px/1.5 Georgia,SimSun,serif;letter-spacing:.06em;color:var(--body)}.tools{display:flex;gap:22px;align-items:center;margin:22px 0 0;font-size:14px;border-bottom:1px solid var(--grid);padding-bottom:10px}.tools b{font-weight:600}.tools a{text-decoration:none;border-bottom:1px solid var(--grid)}.tools a:hover{border-color:var(--ink)}.theme-note{margin:8px 0 0;font-size:12px;letter-spacing:.06em;color:var(--body)}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin:26px 0 18px}.panel{border-top:1px solid var(--grid);padding:14px 0 0}.panel h2{margin:3px 0 1px}.panel svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:var(--body)}.standard{border-top:1px solid var(--ink);padding-top:12px;margin-top:26px}.standard p{margin:8px 0 0;color:var(--body)}.solo{max-width:840px}.solo .panel{border:0}@media(max-width:800px){.pair{grid-template-columns:1fr}}main{max-width:980px}svg{width:100%;display:block}p{font-size:14px}</style><main><header><small>BAR-007-A · 横向条与目标刻线</small><h1>实际值与目标</h1></header><svg role="img" aria-label="柱条代表实际值，竖向刻线代表该类别目标。" viewBox="0 0 720 390"></svg><p>柱条代表实际值，竖向刻线代表该类别目标。</p></main><script>const s=document.querySelector('svg'),ns='http://www.w3.org/2000/svg',ink='#222222',grid='#dddddd';
function el(t,a,v){let n=document.createElementNS(ns,t);for(let [k,x]of Object.entries(a))n.setAttribute(k,x);if(v!==undefined)n.textContent=v;s.append(n);return n}
function text(x,y,v,anchor='middle',size=14){return el('text',{x,y,'text-anchor':anchor,'font-size':size},v)}
function line(x,y,X,Y,c=grid,w=1){el('line',{x1:x,y1:y,x2:X,y2:Y,stroke:c,'stroke-width':w})}
function axes(l=80,t=65,b=280,r=650){el('path',{d:`M${l} ${t}V${b}H${r}m0 0h8l-4 3 M${l} ${t}v-8l-3 4`,fill:'none',stroke:ink,'stroke-width':1.2})}
text(360,28,'图表标题','middle',20);

const data=[['A',72,90],['B',85,80],['C',54,70],['D',92,100]],left=80,right=650,scale=(right-left)/120;
axes();[0,30,60,90,120].forEach(v=>{line(left+v*scale,65,left+v*scale,280);text(left+v*scale,302,v)});
data.forEach(([name,v,t],i)=>{let y=90+i*50;el('rect',{x:left,y:y-11,width:v*scale,height:22,fill:i===0?ink:'#999999'});line(left+t*scale,y-18,left+t*scale,y+18,ink,2);text(62,y+5,name,'end');text(left+v*scale+7,y+5,v,'start');text(left+t*scale,y-24,t,'middle',12)});
text(650,330,'名称 / 单位','end',12);el('rect',{x:240,y:350,width:13,height:13,fill:'#999999'});text(263,362,'实际值','start');line(380,347,380,366,ink,2);text(395,362,'目标值','start');
</script></html>
