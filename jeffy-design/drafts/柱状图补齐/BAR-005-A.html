<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>正负变化</title><style>*{box-sizing:border-box}body{--paper:#ffffff;--ink:#222222;--body:#444444;--grid:#dddddd;--bar:#aaaaaa;--accent:#222222;--soft:#eeeeee;margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Georgia,'Noto Serif SC',SimSun,serif}a{color:inherit;text-underline-offset:4px}button{cursor:pointer;border:0;background:transparent;padding:5px 14px;font:inherit;color:inherit}main{max-width:1500px;margin:auto;padding:35px 4.6vw}header{border-bottom:1px solid var(--ink);padding-bottom:20px}h1{font-weight:400;font-size:28px;line-height:1.18;letter-spacing:0;margin:0}h2{font-size:20px;margin:0;font-weight:600}small,.meta{font:12px/1.5 Georgia,SimSun,serif;letter-spacing:.06em;color:var(--body)}.tools{display:flex;gap:22px;align-items:center;margin:22px 0 0;font-size:14px;border-bottom:1px solid var(--grid);padding-bottom:10px}.tools b{font-weight:600}.tools a{text-decoration:none;border-bottom:1px solid var(--grid)}.tools a:hover{border-color:var(--ink)}.theme-note{margin:8px 0 0;font-size:12px;letter-spacing:.06em;color:var(--body)}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin:26px 0 18px}.panel{border-top:1px solid var(--grid);padding:14px 0 0}.panel h2{margin:3px 0 1px}.panel svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:var(--body)}.standard{border-top:1px solid var(--ink);padding-top:12px;margin-top:26px}.standard p{margin:8px 0 0;color:var(--body)}.solo{max-width:840px}.solo .panel{border:0}@media(max-width:800px){.pair{grid-template-columns:1fr}}main{max-width:980px}svg{width:100%;display:block}p{font-size:14px}</style><main><header><small>BAR-005-A · 横向发散条</small><h1>正负变化</h1></header><svg role="img" aria-label="正负值沿同一零线展开，数轴按实际数据自动计算。" viewBox="0 0 720 390"></svg><p>正负值沿同一零线展开，数轴按实际数据自动计算。</p></main><script>
const initialData=[['A',12],['B',7],['C',-5],['D',-10]];
function render(data){
 const svg=document.querySelector('svg'),ns='http://www.w3.org/2000/svg';svg.replaceChildren();
 if(!Array.isArray(data)||!data.length||data.some(d=>!Array.isArray(d)||typeof d[0]!=='string'||!Number.isFinite(d[1])))throw Error('需要非空的类别与有限数值数组');
 function add(tag,attrs,value){let n=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(value!==undefined)n.textContent=value;svg.append(n);return n}
 function label(x,y,v,anchor='middle',size=14){return add('text',{x,y,'text-anchor':anchor,'font-size':size},v)}
 function line(x,y,X,Y,color='#dddddd',width=1){add('line',{x1:x,y1:y,x2:X,y2:Y,stroke:color,'stroke-width':width})}
 function measure(v){let t=label(0,0,v),w=t.getBBox().width;t.remove();return w}
 const format=v=>v===0?'0':Math.abs(v)>=1e7||Math.abs(v)<1e-5?v.toExponential(2):Number(v.toPrecision(10)).toString();
 const lo=Math.min(0,...data.map(d=>d[1])),hi=Math.max(0,...data.map(d=>d[1]));
 const raw=(hi-lo||1)/5,power=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].find(v=>v*power>=raw)*power;
 const min=Math.floor(lo/step)*step,max=Math.ceil(hi/step)*step||step;
 const padding=Math.max(...data.map(d=>measure((d[1]>0?'+':'')+format(d[1]))))+14;
 const categoryWidth=Math.max(...data.map(d=>measure(d[0])))+20;
 const width=Math.max(720,categoryWidth+padding*2+440),height=150+Math.max(4,data.length)*54;
 const left=categoryWidth+padding,right=width-padding-18,top=65,bottom=height-100,x=v=>left+(v-min)/(max-min)*(right-left),zero=x(0);
 svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 svg.setAttribute('aria-label',data.map(d=>d.join(' ')).join('，'));
 label(width/2,28,'图表标题','middle',20);
 const count=Math.round((max-min)/step);
 for(let i=0;i<=count;i++){let v=+(min+i*step).toPrecision(12),X=x(v);line(X,top,X,bottom,v===0?'#222222':'#dddddd',v===0?1.5:1);label(X,bottom+24,format(v),'middle',12)}
 add('path',{d:`M${zero} ${top}v-8l-3 4 M${left} ${bottom}H${right}h8l-4 3`,stroke:'#222222',fill:'none','stroke-width':1.2});
 data.forEach(([name,v],i)=>{let y=top+(i+.5)*(bottom-top)/data.length;
 add('rect',{x:Math.min(zero,x(v)),y:y-12,width:Math.abs(x(v)-zero),height:24,fill:v>=0?'#222222':'#aaaaaa','data-value':v});
 label(categoryWidth-15,y+5,name,'end');label(x(v)+(v>=0?8:-8),y+5,(v>0?'+':'')+format(v),v>=0?'start':'end');
 });
 label(right,bottom+53,'名称 / 单位','end',12);
 return {min,max,zero,step};
}
render(initialData);
</script></html>
