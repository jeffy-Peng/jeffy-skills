<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REL-001 层级结构</title><style>body{margin:35px;color:#222;background:white;font:16px/1.8 Georgia,"Noto Serif SC",SimSun,serif}main{max-width:1200px;margin:auto}header{display:flex;gap:18px;align-items:baseline}h1{font-size:28px;font-weight:400}small{font-size:14px;color:#555}nav{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0}label{display:flex;gap:7px;align-items:center;cursor:pointer}input{accent-color:#222}.scroll{overflow:auto}svg{display:block;width:100%;min-width:750px}svg text{font-family:inherit}</style><main><header><small>REL-001</small><h1>层级结构</h1></header><nav><label><input type="radio" name="direction" value="vertical" checked>上下展开</label><label><input type="radio" name="direction" value="horizontal">左右展开</label><label><input type="radio" name="count" value="3" checked>3 个分支</label><label><input type="radio" name="count" value="5">5 个分支</label><label><input type="checkbox" name="focus">强调根节点</label></nav><div class="scroll"><svg role="img"></svg></div><small>输入节点及上下级关系，自动安排位置与连接线。连接线表示归属层级；关系动作由具体页面另行标注。</small></main><script src="hierarchy.js"></script></html>
