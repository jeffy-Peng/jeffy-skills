<!doctype html><meta charset="utf-8"><title>分层素材：样张与设计理由</title><style>body{margin:30px;font:18px/1.8 Georgia,serif;color:#222}iframe{width:100%;height:800px;border:1px solid #ddd}a{color:#333}</style><h1>同一套规范，不同结构</h1><p>常规样张：各模块地位相近，因此等宽分格；同层内容量相近，因此使用近似等高横带。这是该样张的选择，不是规范要求。</p><iframe title="常规样张" src="../../drafts/机制表达审核/REL-004.html"></iframe><p>适配案例：内容出现跨层实体与层内分组，因此重新组织几何，不强迫生成器补充更多参数。</p><a href="../../examples/layer-adaptation/index.html">打开重新设计案例与理由</a> · <a href="规范.md">阅读规范</a>
