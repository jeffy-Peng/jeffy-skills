<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABLE-002 交叉比较矩阵</title><style>body{margin:35px;background:#fff;color:#222;font:16px/1.8 Georgia,"Noto Serif SC",SimSun,serif}main{max-width:1200px;margin:auto}header{display:flex;align-items:baseline;gap:18px}h1{font-size:28px;font-weight:400}small{font-size:14px;color:#555}nav{display:flex;gap:30px;margin:20px 0 35px}label{display:flex;align-items:center;gap:7px;cursor:pointer}input{accent-color:#222}.scroll{overflow-x:auto}.detail-table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}.detail-table caption{font-size:20px;text-align:center;padding-bottom:28px}.detail-table td,.detail-table th{padding:15px 18px;text-align:center;vertical-align:middle;overflow-wrap:anywhere;line-height:1.7;font-weight:400;border-bottom:1px solid #ddd}.detail-table thead th{border-top:1.4px solid #222;border-bottom:1px solid #222;font-weight:600;background:#f3f3f3}.detail-table tbody tr:last-child>*{border-bottom:1.4px solid #222}.detail-table .number{text-align:center}.detail-table .focus{background:#eeeeee}.detail-table thead .focus{background:#dddddd}.detail-table .stripe{background:#f7f7f7}.table-note{margin:14px 0;font-size:12px;color:#666}</style><main data-kind="matrix"><header><small>TABLE-002</small><h1>交叉比较矩阵</h1></header><nav><label><input type="radio" name="mode" value="status" checked>具备状态</label><label><input type="radio" name="mode" value="numeric">数值</label><label><input type="checkbox" name="stripe">隔行底色</label><label><input type="checkbox" name="focus">强调维度一</label></nav><div id="error" role="alert"></div><div class="scroll" id="table"></div><small>行列由数据生成。表头与单元格内容居中对齐，长文本自动换行；列数过多时保留字号并横向滚动。</small></main><script src="table.js"></script></html>
