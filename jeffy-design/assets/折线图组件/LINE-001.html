<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE-001 折线图</title><style>body{margin:35px;color:#222;background:#fff;font:16px/1.8 Georgia,"Noto Serif SC",SimSun,serif}main{max-width:1200px;margin:auto}header{display:flex;align-items:baseline;gap:18px}h1{font-size:28px;font-weight:400}small{font-size:14px;color:#555}nav{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin:18px 0}label{cursor:pointer;display:flex;align-items:center;gap:7px}input{accent-color:#222}.scroll{overflow:auto}svg{display:block;width:100%;min-width:750px}svg text{font-family:inherit}#error{color:#222}.options{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:14px 0}.options b{font-size:14px;color:#777;font-weight:400}</style><main><header><small>LINE-001</small><h1>折线图</h1></header><nav><label><input type="radio" name="series" value="single">单系列</label><label><input type="radio" name="series" value="multi" checked>多系列</label><label><input type="checkbox" name="points" checked>显示数据点</label><label><input type="checkbox" name="zero">数轴包含零</label></nav><div class="options"><b>线形</b><label><input type="radio" name="shape" value="linear" checked>普通折线</label><label><input type="radio" name="shape" value="step">阶梯线</label></div><div class="options"><b>数值</b><label><input type="radio" name="mode" value="raw" checked>原值</label><label><input type="radio" name="mode" value="cumulative" >累计值</label><label><input type="radio" name="mode" value="index" >基期指数</label></div><div class="options"><b>显示</b><label><input type="checkbox" name="area">面积填充</label><label><input type="checkbox" name="labels">终点数值</label><label><input type="checkbox" name="focus">强调系列一</label></div><div id="error" role="alert"></div><div class="scroll"><svg role="img"></svg></div><small>时间点按输入顺序等距排列。累计模式在缺失值后停止累计；基期指数要求首值非零。面积重叠显示各系列，分别从零线填充。缺失值断开连线；悬停或键盘聚焦可读取对应时点。切换数据请调用 renderLine(svg, input, options)。</small></main><script src="../共用/legend.js"></script><script src="line.js"></script><script src="../共用/motion.js"></script><script>requestAnimationFrame(()=>playChartEntrance(document.querySelector("svg")))</script></html>
