<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATRIX-001 二维定位矩阵</title><style>body{margin:35px;color:#222;background:#fff;font:16px/1.8 Georgia,"Noto Serif SC",SimSun,serif}main{max-width:1200px;margin:auto}header{display:flex;align-items:baseline;gap:18px}h1{font-size:28px;font-weight:400}small{font-size:14px;color:#555}nav{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin:18px 0}label{cursor:pointer;display:flex;align-items:center;gap:7px}input{accent-color:#222}.scroll{overflow:auto}svg{display:block;width:100%;min-width:750px}svg text{font-family:inherit}#error{color:#222}.options{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:14px 0}.options b{font-size:14px;color:#777;font-weight:400}.threshold-fields{display:flex;gap:28px;margin:12px 0 24px}.threshold-fields input{font:inherit;width:85px;padding:4px 9px;border:1px solid #aaa;background:white;color:#222}</style><main><header><small>MATRIX-001</small><h1>二维定位矩阵</h1></header><nav><label><input type="checkbox" name="labels" checked>名称标注</label><label><input type="radio" name="split" value="auto" checked>范围中点分界</label><label><input type="radio" name="split" value="fixed">指定值分界</label><label><input type="checkbox" name="focus">强调 C</label></nav><div id="thresholds" hidden><div class="threshold-fields"><label>横向分界值 <input type="number" name="thresholdX" value="40" step="any"></label><label>纵向分界值 <input type="number" name="thresholdY" value="60" step="any"></label></div></div><div id="error" role="alert"></div><div class="scroll"><svg role="img"></svg></div><small>每个对象按两个维度定位。象限名称和分界值在实际使用时按本页问题确定；范围中点只用于预览，不代表业务阈值。名称自动避让，密集时保留悬停和键盘读数。点的大小固定，重点对象适度放大。</small></main><script src="matrix.js"></script></html>
