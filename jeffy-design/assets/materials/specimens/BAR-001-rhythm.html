    const widthOf = (css) => {
      ctx.font = '32px ' + css;
      return ctx.measureText(probe).width;
    };
    const missing = [];
    // 内嵌子集是按本页字符裁过的，度量与整字体有微小出入，这一档只做族名检查。
    const embedded = Boolean(doc.querySelector('style[data-embedded-fonts]'));
    let driftedFamily = null;
    for (const family of families) {
      const familyCss = `"${family}"`;
      try {
        await doc.fonts.load(`16px ${familyCss}`);
      } catch {}
      await doc.fonts.ready;
      const loaded = doc.fonts.check(`16px ${familyCss}`);
      // 与两种通用字体比较：宽度都相同说明浏览器回退了，声明的族名没有真正命中。
      const viaFamilyMono = widthOf(`${familyCss},monospace`);
      const viaFamilySerif = widthOf(`${familyCss},serif`);
      const fallback =
        Math.abs(viaFamilyMono - widthOf('monospace')) < 0.01 && Math.abs(viaFamilySerif - widthOf('serif')) < 0.01;
      let drifted = null;
      const reference = ((window.compositionInput && window.compositionInput.fontMetrics) || {})[family];
      if (!embedded && reference && reference.advance) {
        // 同名替代字体（Noto Serif CJK SC 之于 Noto Serif SC）族名检查分辨不出来，比实测度量。
        ctx.font = `100px ${familyCss}`;
        const measured = ctx.measureText(reference.probe).width;
        const tolerance = Math.max(1, reference.advance * 0.015);
        if (Math.abs(measured - reference.advance) > tolerance) {
          drifted = { family, measured: +measured.toFixed(2), expected: reference.advance };
        }
      }
      if (!loaded || fallback || drifted) missing.push(family);
      if (drifted) driftedFamily = drifted;
    }
    if (missing.length) {
      const detail = driftedFamily
        ? `，实测宽度 ${driftedFamily.measured} 与参考 ${driftedFamily.expected} 不符，安装的是同名替代字体`
        : '';
      const error = Object.assign(Error('字体不可用：' + missing.join('、') + detail), { code: 'FONT' });
      error.missing = missing;
      if (driftedFamily) error.drifted = driftedFamily;
      error.hint = 'bash scripts/install-fonts.sh';
      throw error;
    }
    return families;
  },
};

// Shared legend layout for axes and free-standing charts.
window.KitLegend = {
  draw(p, items, opts) {
    const { left, right, y, lineHeight, gap, fail } = opts;
    const role = opts.role || 'legend';
    const sw = p.tokens.legendSwatchW,
      sh = p.tokens.legendSwatchH;
    const symbolW = Math.max(20, sw),
      labelGap = 6;
    const rows = [[]];
    let used = 0;
    for (const item of items) {
      const width = symbolW + labelGap + p.measure(item.name, role);
      if (width > right - left) fail('CAPACITY', '单项图例名称超出可用宽度');
      if (rows.at(-1).length && used + gap + width > right - left) {
        rows.push([]);
        used = 0;
      }
      if (rows.length > 2) fail('CAPACITY', '图例超过两行，需调整区域或表达');
      rows.at(-1).push({ item, width });
      used += (used ? gap : 0) + width;
    }
    const group = p.add('g', { 'data-unified-legend': 'true' });
    rows.forEach((row, index) => {
      const width = row.reduce((sum, c) => sum + c.width, 0) + gap * Math.max(0, row.length - 1);
      let x = left + (right - left - width) / 2;
      // Anchor the last row at y, keeping wrapped rows within the reserved bottom area.
      const cy = y - (rows.length - 1 - index) * lineHeight;
      for (const { item, width } of row) {
        const mark =
          item.type === 'bar'
            ? p.box('legend' + item.name, x, cy - sh / 2, sw, sh, item.paint, { stroke: 'none' })
            : p.line('legend' + item.name, `M${x} ${cy}h${symbolW}`, item.paint, {
                'stroke-dasharray': item.dash || '',
              });
        group.append(mark);
        group.append(p.text(x + symbolW + labelGap, cy, item.name, role, 'start'));
        x += width + gap;
      }
    });
    return group;
  },
};

// 单位与量纲：只在轴端出现一次（R10）。竖向转 90 度放左侧，横向放末刻度下方右对齐。
window.KitUnit = {
  label(p, opts) {
    const { metric, unit, horizontal, right, bottom, top, pad, labelSize, bare } = opts;
    const text = unit ? metric + ' / ' + unit : metric;
    // 无轴时没有轴端可挂，单位落到右下角，横排一行。
    if (bare) {
      p.text(right, bottom + labelSize * 1.6, text, 'unit', 'end');
      return;
    }
    if (horizontal) {
      p.text(right, bottom + labelSize * 2.6, text, 'unit', 'end');
    } else {
      const x = pad + labelSize / 2;
      const y = (top + bottom) / 2;
      p.text(x, y, text, 'unit', 'middle', { transform: `rotate(-90 ${x} ${y})` });
    }
  },
};

// 轴与绘图区：一处算位置、画网格、刻度、轴线与单位。几何只拿回 left/right/top/bottom/coord。
window.KitAxis = {
  // 二维轴：四象限、散点这类两维图共用。刻度、轴名、单位与一维版同一套规则。
  frame2d(p, opts) {
    const { width: W, height: H, xRange, yRange, xLabel, yLabel, unit, num } = opts;
    const bare = (p.tokens.axisMode || 'auto') === 'none';
    const pad = p.tokens.padding,
      gap = p.tokens.gap,
      tickSize = p.roles.axis.size,
      steps = (r) => {
        const out = [];
        for (let v = r.min; v <= r.max + r.step * 0.01; v += r.step) out.push(v);
        return out;
      },
      xt = steps(xRange),
      yt = steps(yRange),
      yw = Math.max(...yt.map((v) => p.measure(num(v)))),
      left = pad + (bare ? 0 : yw + gap * 1.4),
      right = W - pad,
      top = pad + (yLabel ? tickSize * 1.6 : 0),
      bottom = H - pad - tickSize * 1.8 - (xLabel ? tickSize * 1.7 : 0),
      X = (v) => left + ((v - xRange.min) / (xRange.max - xRange.min)) * (right - left),
      Y = (v) => bottom - ((v - yRange.min) / (yRange.max - yRange.min)) * (bottom - top);
    if (!bare) {
      xt.forEach((v) => p.text(X(v), bottom + tickSize * 1.2, num(v), 'axis', 'middle'));
      yt.forEach((v) => p.text(left - gap * 0.7, Y(v), num(v), 'axis', 'end'));
      p.add('path', {
        d: `M${left} ${top}V${bottom}H${right}`,
        fill: 'none',
        stroke: p.color('ink'),
        'stroke-width': p.theme?.rules?.axisWidthPx || p.theme?.rules?.dividerWidthPx || 1,
      });
    }
    if (xLabel) p.text(right, bottom + tickSize * 2.6, xLabel, 'unit', 'end');
    if (yLabel) p.text(left, top - tickSize * 0.9, yLabel, 'unit', 'start');
    if (unit) p.text(right, top - tickSize * 0.9, unit, 'unit', 'end');
    return { left, right, top, bottom, X, Y };
  },
  frame(p, opts) {
    const { width: W, height: H, labels, range, metric, unit, horizontal = false, legend = [], fail, num } = opts;
    // axisMode: none 表示不出轴线、刻度与刻度值，只留类别标签与角落里的单位。
    const bare = (p.tokens.axisMode || 'auto') === 'none';
    const pad = p.tokens.padding,
      gap = p.tokens.gap,
      labelSize = p.roles.pill.size,
      legendH = legend.length ? labelSize * 2 + gap : 0,
      axisH = labelSize * 3 + gap;
    let left =
        pad +
        Math.max(
          ...Array.from({ length: Math.round((range.max - range.min) / range.step) + 1 }, (_, i) =>
            p.measure(num(range.min + i * range.step)),
          ),
        ) +
        labelSize * 2 +
        pad,
      right = W - pad - (p.tokens.axisPadPx || 35),
      top = pad + labelSize,
      bottom = H - axisH - legendH;
    if (bare && !horizontal) left = pad * 2;
    if (horizontal) left = Math.max(left, Math.max(...labels.map((x) => p.measure(x))) + pad * 2);
    if (right - left < 100 || bottom - top < 70) fail('CAPACITY', '数轴与标签所需空间超过目标区域');
    const coord = (v) =>
      horizontal
        ? left + ((v - range.min) / (range.max - range.min)) * (right - left)
        : bottom - ((v - range.min) / (range.max - range.min)) * (bottom - top);
    const ruler = opts.axisStyle === 'ruler';
    const showGrid = !bare && !ruler && p.tokens.grid !== false;
    for (let v = range.min, i = 0; v <= range.max + range.step * 0.01; v += range.step, i++) {
      const a = coord(v);
      // 网格可整体关闭；竖向柱只画横线，横向柱只画竖线，另一条由轴线承担。
      if (showGrid) p.line('grid' + i, horizontal ? `M${a} ${top}V${bottom}` : `M${left} ${a}H${right}`, 'line');
      if (!bare)
        p.text(
          horizontal ? a : left - gap,
          horizontal ? bottom + labelSize : a,
          num(v),
          'axis',
          horizontal ? 'middle' : 'end',
        );
    }
    // 轴线与单位延后到内容之后画，避免被柱子压住。
    const finish = () => {
      if (bare) {
        // 无轴：单位挪到右下角，不画轴线与刻度。
        window.KitUnit.label(p, { metric, unit, horizontal, right, bottom, top, pad, labelSize, bare: true });
        return;
      }
      if (ruler) {
        const span = range.max - range.min;
        const axisLength = horizontal ? right - left : bottom - top;
        const subdivisions = Math.max(1, Math.min(5, Math.floor((axisLength * range.step) / span / 7)));
        let d = horizontal ? `M${left} ${bottom}H${right}` : `M${left} ${top}V${bottom}`;
        const count = Math.round((span / range.step) * subdivisions);
        for (let i = 0; i <= count; i++) {
          const a = coord(range.min + (i * range.step) / subdivisions);
          const size = i % subdivisions === 0 ? 9 : 4;
          d += horizontal ? `M${a} ${bottom}v${size}` : `M${left} ${a}h-${size}`;
        }
        p.add('path', {
          d,
          fill: 'none',
          stroke: p.color('ink'),
          'stroke-width': p.theme?.rules?.axisWidthPx || 1.3,
          'data-axis-style': 'ruler',
        });
        window.KitUnit.label(p, { metric, unit, horizontal, right, bottom, top, pad, labelSize });
        return;
      }
      // 轴线形状取自素材原画法 bar.js：横轴右端小箭头，纵轴顶端小箭头。
      p.add('path', {
        d: `M${left} ${top}V${bottom}H${right}h8l-4 3 M${left} ${top}v-8l-3 4`,
        fill: 'none',
        stroke: p.color('ink'),
        'stroke-width': p.theme?.rules?.axisWidthPx || 1.3,
      });
      // 刻度短线一律朝内：数值轴画在轴内侧 4 像素，类别轴也各给一小段。
      let ticks = '';
      for (let v = range.min; v <= range.max + range.step * 0.01; v += range.step) {
        const a = coord(v);
        ticks += horizontal ? `M${a} ${bottom}V${bottom - 4}` : `M${left} ${a}H${left + 4}`;
      }
      const slot = (right - left) / labels.length;
      labels.forEach((_, i) => {
        const c = left + (i + 0.5) * slot;
        ticks += horizontal ? `M${left} ${c}H${left + 4}` : `M${c} ${bottom}V${bottom - 4}`;
      });
      p.add('path', {
        d: ticks,
        fill: 'none',
        stroke: p.color('ink'),
        'stroke-width': p.theme?.rules?.axisWidthPx || 1.3,
      });
      window.KitUnit.label(p, { metric, unit, horizontal, right, bottom, top, pad, labelSize });
    };
    if (legend.length) {
      window.KitLegend.draw(p, legend, {
        left,
        right,
        y: H - labelSize,
        lineHeight: labelSize * 1.6,
        gap: gap * 2,
        fail,
      });
    }
    return { left, right, top, bottom, coord, finish };
  },
};

// All typography and paint is resolved here. Renderers supply semantics and geometry.
window.ThemeDrawing = {
  async fonts(doc, theme) {
    await window.ThemeFontCheck.fonts(doc, theme);
  },
  create(svg, theme) {
    const doc = svg.ownerDocument,
      ns = 'http://www.w3.org/2000/svg',
      roles = Object.fromEntries(theme.scale.map((x) => [x.role, x])),
      tokens = theme.materials,
      ctx = doc.createElement('canvas').getContext('2d');
    const color = (role) => '#' + theme.colors[role];
    const family = (r) =>
      r.font === 'latin' ? `"${theme.fonts.latin}"` : `"${theme.fonts.latin}","${theme.fonts.ea}"`;
    function add(tag, a, value) {
      let n = doc.createElementNS(ns, tag);
      for (let [k, v] of Object.entries(a)) n.setAttribute(k, v);
      if (value !== undefined) n.textContent = value;
      svg.append(n);
      return n;
    }
    function text(x, y, value, role = 'pill', anchor = 'middle', extra = {}) {
      let r = roles[role];
      if (!r) throw Error('THEME: unknown role ' + role);
      return add(
        'text',
        {
          x,
          y,
          'data-theme-role': role,
          'text-anchor': anchor,
          'dominant-baseline': 'central',
          'font-family': family(r),
          'font-size': r.size,
          'font-weight': r.weight,
          'letter-spacing': r.tracking,
          fill: color(r.color),
          ...extra,
        },
        value,
      );
    }
    function measure(value, role = 'pill') {
      let r = roles[role];
      ctx.font = `${r.weight} ${r.size}px ${family(r)}`;
      let tracking = parseFloat(r.tracking) || 0;
      return ctx.measureText(String(value)).width + Math.max(0, String(value).length - 1) * tracking;
    }
    function wrap(value, width, role = 'pill') {
      if (width <= 0) throw Object.assign(Error('文字区域不足'), { code: 'CAPACITY' });
      let out = [],
        line = '';
      for (let c of String(value ?? '')) {
        if (measure(line + c, role) > width && line) {
          out.push(line);
          line = c;
        } else line += c;
      }
      if (line) out.push(line);
      return out;
    }
    function block(x, y, value, width, role = 'pill', anchor = 'start', extra = {}) {
      let ls = wrap(value, width, role),
        step = roles[role].size * roles[role].lineHeight;
      ls.forEach((line, i) => text(x, y + i * step, line, role, anchor, extra));
      return ls.length * step;
    }
    function line(id, d, role = 'line', extra = {}) {
      return add('path', {
        'data-shape-role': role,
        'data-key': id,
        d,
        fill: 'none',
        stroke: color(role),
        'stroke-width': theme.rules.dividerWidthPx,
        ...extra,
      });
    }
    function box(id, x, y, width, height, role = tokens.nodeFill, extra = {}) {
      return add('rect', {
        'data-shape-role': role,
        'data-key': id,
        x,
        y,
        width,
        height,
        rx: tokens.radius,
        fill: color(role),
        stroke: color('muted'),
        'stroke-width': theme.rules.dividerWidthPx,
        ...extra,
      });
    }
    function contrast(role) {
      const c = theme.colors[role]
          .match(/../g)
          .map((v) => parseInt(v, 16) / 255)
          .map((v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)),
        l = c[0] * 0.2126 + c[1] * 0.7152 + c[2] * 0.0722;
      return l > 0.35 ? 'ink' : 'paper';
    }
    function series(i) {
      return ['accent', 'accent2', 'body', 'muted'][i % 4];
    }
    function legend(items, W, y) {
      const fail = (code, message) => {
        throw Object.assign(Error(message), { code });
      };
      return window.KitLegend.draw({ add, text, measure, box, line, tokens, color }, items, {
        left: tokens.padding,
        right: W - tokens.padding,
        y,
        lineHeight: roles.pill.size * 1.6,
        gap: tokens.gap * 2,
        role: 'pill',
        fail,
      });
    }

    return { add, text, measure, wrap, block, line, box, color, contrast, series, legend, tokens, roles, theme };
  },
};

window.ThemeRenderers = (() => {
  const fail = (code, message) => {
      throw Object.assign(Error(message), { code });
    },
    num = (v) => Number(Number(v).toPrecision(6)).toString();
  function setup(svg, theme, box) {
    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    svg.style.cssText = `width:${box.width}px;height:${box.height}px`;
    // 笔触按族选择：主题给每个原型指定一套，未指定用线条。
    const archetype = window.__archetype || 'compare';
    const brushConfig = theme.brush || {};
    const brush = (brushConfig.byFamily && brushConfig.byFamily[archetype]) || brushConfig.default || 'line';
    const params = (brushConfig.params && brushConfig.params[brush]) || {};
    return ThemeDrawing.create(svg, theme);
  }
  function domain(vals, zero = true) {
    let lo = Math.min(...vals),
      hi = Math.max(...vals);
    if (zero) {
      lo = Math.min(0, lo);
      hi = Math.max(0, hi);
    }
    if (lo === hi) {
      let d = Math.abs(lo) * 0.1 || 1;
      lo -= zero && lo === 0 ? 0 : d;
      hi += d;
    }
    let raw = (hi - lo) / 4,
      p = 10 ** Math.floor(Math.log10(raw)),
      step = [1, 2, 2.5, 5, 10].find((v) => v * p >= raw) * p;
    return { min: Math.floor(lo / step) * step, max: Math.ceil(hi / step) * step, step };
  }
  function frame(p, W, H, labels, range, metric, unit, horizontal = false, legend = [], axisStyle) {
    // 轴、单位、图例统一由 lib/kit 负责，几何只拿回可用区域与坐标换算。
    return KitAxis.frame(p, {
      width: W,
      height: H,
      labels,
      range,
      metric,
      unit,
      horizontal,
      legend,
      fail,
      num,
      axisStyle,
    });
  }
  // 相对亮度：格子上的字取深还是取浅，按背景实际亮度定。
  function luminance(hex) {
    const c = [0, 2, 4]
      .map((i) => parseInt(String(hex).replace('#', '').substr(i, 2), 16) / 255)
      .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

  function isLight(hex, inkHex, paperHex) {
    const l = luminance(hex);
    const ratio = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    return ratio(l, luminance(inkHex)) >= ratio(l, luminance(paperHex));

  function rampColor(theme, t, f) {
    const roles = t.shadeRamp && t.shadeRamp.length ? t.shadeRamp : ['ink', 'soft'],
      hex = (h) =>
        [0, 2, 4].map((i) =>
          parseInt(
            String(h)
              .replace('#', '')
              .slice(i, i + 2),
            16,
          ),
        ),
      a = hex(theme.colors[roles[0]]),
      b = hex(theme.colors[roles[roles.length - 1]]);
    return (
      '#' +
      a
        .map((c, i) =>
          Math.round(c + (b[i] - c) * f)
            .toString(16)
            .padStart(2, '0'),

        .join('')

        material === 'BAR-005'
          ? 'sign'
          : material === 'BAR-007'
            ? 'target'
            : material === 'DIST-001'
              ? 'distribution'
              : material === 'BAR-002'
                ? 'grouped'
                : material === 'BAR-003'
                  ? 'stacked'
                  : material === 'BAR-006'
                    ? 'waterfall'
                    : 'single',
      percent = kind === 'stacked' && opt.mode === 'percent';
    if (opt.kind && opt.kind !== kind && !['solid', 'capsule', 'rung', 'rhythm'].includes(opt.kind))
      fail('UNSUPPORTED', 'kind与素材ID不一致');
    const style = ['solid', 'capsule', 'rung', 'rhythm'].includes(opt.kind)
      ? opt.kind
      : theme.materials.barStyle || 'solid';
    if (style === 'rhythm' && kind !== 'single') fail('UNSUPPORTED', '随机分节当前仅支持单系列比较');
    if (style === 'rung' && horizontal) fail('UNSUPPORTED', '刻度柱当前仅支持纵向；横向请按规范重绘');
    let labels, rows, series;

      rows.push({ label: '合计', start: 0, end: total, value: total, total: true });

            !d.label ||

  function pie(svg, input, opt, theme, box) {

  // 双编码饼：角度读占比，半径读强度。扇瓣留缝做圆角，外圈内圈各一条虚线参考圈。

        'data-focus-key': 'petal' + i,
        'data-focus-label':

  // 热力矩阵：单元格按值归一填色，缺失格留白（斜纹），行列表头在侧边。

  // 雷达：轴数有上限，网格同心，值连成多边形。
